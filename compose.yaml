services:

  db:
    image: postgres:17

    environment:
      POSTGRES_DB: eawms
      POSTGRES_USER: eawms_user
      POSTGRES_PASSWORD: eawms_password

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eawms_user -d eawms"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: gunicorn eawms.wsgi:application --bind 0.0.0.0:8000

    env_file:
    - .env

    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: ./frontend

    ports:
      - "80:80"

    depends_on:
      - web

volumes:
  postgres_data: