{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}EAWMS{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <header>
        <h1>EAWMS</h1>
        <nav>
            <a href="{% url 'employee-list' %}">Employees</a>
            <a href="{% url 'project-list' %}">Projects </a>
            <a href="{% url 'asset-list' %}">Assets</a>
            <a href="{% url 'attendance-list' %}">Attendance</a>
            <a href="{% url 'notification-list' %}"> Notifications</a>
            <a href="{% url 'report-dashboard' %}">Reports</a>
                <a href="{% url 'attendance-management' %}">
    Attendance Management
</a>

            {% if user.is_authenticated %}

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">
                    Logout
                </button>

            </form>

        {% endif %}

        </nav>

    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
