{% extends "base.html" %}

{% block title %}

{% block content %}

<div class="container">

    <h2>Assign Employee</h2>

    <p>
        Project: <strong>{{ project.name }}</strong>

            Assign Employee
        </button>
    </form>

</div>

{% endblock %}
